<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货行情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        .positive { color: red; font-weight: bold; }
        .negative { color: green; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">期货行情演示</h1>
        <p class="mb-4 text-gray-600">✅ GitHub纯静态页面，无跨域问题，直接访问</p>
        
        <table class="w-full border-collapse">
            <tr class="bg-gray-100">
                <th class="border p-2 text-left">代码</th>
                <th class="border p-2 text-left">名称</th>
                <th class="border p-2 text-right">最新价</th>
                <th class="border p-2 text-right">涨跌幅</th>
            </tr>
            <tr>
                <td class="border p-2">RB2505</td>
                <td class="border p-2">螺纹钢</td>
                <td class="border p-2 text-right">3682</td>
                <td class="border p-2 text-right positive">+0.33%</td>
            </tr>
            <tr>
                <td class="border p-2">I2505</td>
                <td class="border p-2">铁矿石</td>
                <td class="border p-2 text-right">958</td>
                <td class="border p-2 text-right positive">+1.59%</td>
            </tr>
            <tr>
                <td class="border p-2">HC2505</td>
                <td class="border p-2">热卷</td>
                <td class="border p-2 text-right">3852</td>
                <td class="border p-2 text-right negative">-0.21%</td>
            </tr>
        </table>
    </div>
</body>
</html>
